  <defs>
    <style>
      .tokenapi-arrow-white {
        stroke: #000;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .tokenapi-arrow-white, .tokenapi-circle {
        fill: none;
      }

      .tokenapi-cube, .tokenapi-circle, .tokenapi-box {
        stroke-miterlimit: 10;
      }

      .tokenapi-cube {
        stroke: #fff;
        stroke-width: .25px;
      }

      .tokenapi-circle {
        stroke: #be0000;
      }

      .tokenapi-bg, .tokenapi-box {
        fill: #fff;
      }

      .tokenapi-glyph {
        fill: #151515;
      }

      .tokenapi-box {
        stroke: #b4b4b4;
      }

      .tokenapi-icon {
        fill: none;
        stroke: #000;
        stroke-width: 1.066px;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Canvas background -->
  <rect class="tokenapi-bg" x="-.606" y="-.571" width="595.248" height="101.758"/>

  <!-- ============================ BOXES ============================ -->
  <!-- Box A: TokenRequest API -->
  <rect class="tokenapi-box" x="8" y="32" width="118" height="42"/>
  <!-- Box B: kubelet -->
  <rect class="tokenapi-box" x="158" y="32" width="118" height="42"/>
  <!-- Box C: Pod -->
  <rect class="tokenapi-box" x="308" y="32" width="118" height="42"/>
  <!-- Box D: Kubernetes API server -->
  <rect class="tokenapi-box" x="458" y="32" width="118" height="42"/>

  <!-- ============================ ARROWS ============================ -->
  <!-- Between A and B: two arrows (1: request to TokenRequest API, and return) -->
  <!-- Arrow: kubelet -> TokenRequest API (top, points left) -->
  <g>
    <line class="tokenapi-arrow-white" x1="126" y1="46.5" x2="158" y2="46.5"/>
    <g>
      <line class="tokenapi-arrow-white" x1="132" y1="46.5" x2="158" y2="46.5"/>
      <polygon points="132.9 42.76 126.42 46.5 132.9 50.24 132.9 42.76"/>
    </g>
  </g>
  <!-- Arrow: TokenRequest API -> kubelet (bottom, points right, returns token) -->
  <g>
    <line class="tokenapi-arrow-white" x1="126" y1="60" x2="158" y2="60"/>
    <g>
      <line class="tokenapi-arrow-white" x1="126" y1="60" x2="152" y2="60"/>
      <polygon points="151.1 63.74 157.58 60 151.1 56.26 151.1 63.74"/>
    </g>
  </g>

  <!-- Between B and C: arrow 2 (kubelet mounts token into Pod, points right) -->
  <g>
    <line class="tokenapi-arrow-white" x1="276" y1="53" x2="308" y2="53"/>
    <g>
      <line class="tokenapi-arrow-white" x1="276" y1="53" x2="302" y2="53"/>
      <polygon points="301.1 56.74 307.58 53 301.1 49.26 301.1 56.74"/>
    </g>
  </g>

  <!-- Between C and D: arrow 3 (application authenticates to API server, points right) -->
  <g>
    <line class="tokenapi-arrow-white" x1="426" y1="53" x2="458" y2="53"/>
    <g>
      <line class="tokenapi-arrow-white" x1="426" y1="53" x2="452" y2="53"/>
      <polygon points="451.1 56.74 457.58 53 451.1 49.26 451.1 56.74"/>
    </g>
  </g>

